<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpenseHub</title>
  <!-- Add this Supabase script library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <!-- App Name on top -->
    <div class="app-title">
      <span style="font-size: 1.5rem; margin-right: 8px;">💰</span> Expenses Tracker
    </div>
    
    <!-- Navigation Buttons below -->
    <nav class="nav-buttons">
      <button id="nav-dashboard" class="active" onclick="switchPage('dashboard')">Dashboard</button>
      <button id="nav-overview" onclick="switchPage('overview')">Overview</button>
      <button id="nav-transactions" onclick="switchPage('transactions')">Transactions</button>
    </nav>
  </header>

  <main>
    <!-- Dashboard Page -->
    <section id="page-dashboard" class="page-section">
      <div class="card balance-card">
        <div class="balance-title">Net Balance</div>
        <div id="net-balance" class="balance-amount">$0.00</div>
        <div class="balance-sub">
          <div>Income <span id="total-income" class="income-text">$0.00</span></div>
          <div>Expenses <span id="total-expenses" class="expense-text">$0.00</span></div>
        </div>
      </div>

      <div class="card">
        <h3>Quick Summary</h3>
        <div class="summary-grid">
          <div>
            <div class="summary-label">THIS MONTH</div>
            <div id="month-total" class="summary-value">$0.00</div>
          </div>
          <div>
            <div class="summary-label">THIS WEEK</div>
            <div id="week-total" class="summary-value">$0.00</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Spending by Category</h3>
        <div id="category-breakdown"></div>
      </div>
    </section>

    <!-- Overview Page -->
    <section id="page-overview" class="page-section" style="display: none;">
      <div class="card">
        <h3>Analytics & Overview</h3>
        <p>Detailed charts and insights for your spending habits.</p>
      </div>
    </section>

    <!-- Transactions Page -->
    <section id="page-transactions" class="page-section" style="display: none;">
      <div class="card">
        <h3>Add New Entry</h3>
        <form id="transaction-form" onsubmit="addTransaction(event)">
          <div class="form-group">
            <label>Type</label>
            <select id="txn-type">
              <option value="Expense">Expense</option>
              <option value="Income">Income</option>
            </select>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="txn-category">
              <option value="Normal Eating">🥗 Normal Eating</option>
              <option value="Groceries">🛒 Groceries</option>
              <option value="Transport">🚗 Transport</option>
              <option value="Utilities">⚡ Utilities</option>
              <option value="Entertainment">🎬 Entertainment</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description</label>
            <input type="text" id="txn-desc" placeholder="e.g., Groceries" required>
          </div>
          <div class="form-group">
            <label>Amount ($)</label>
            <input type="number" id="txn-amount" step="0.01" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="txn-date" required>
          </div>
          <button type="submit" class="btn-primary">Add Transaction</button>
        </form>
      </div>

      <div class="card">
        <div class="card-header-flex">
          <h3>History & Export</h3>
          <select id="filter-time" onchange="filterTransactions()">
            <option value="all">All-Time</option>
            <option value="month">This Month</option>
            <option value="week">This Week</option>
          </select>
        </div>
        <div id="transactions-list">Loading data from Supabase...</div>
        <button onclick="exportCSV()" class="btn-secondary">Export CSV</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
