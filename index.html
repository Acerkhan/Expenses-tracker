<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
        </header>

        <div class="card">
            <div class="total-balance">
                <h3>Net Balance</h3>
                <p id="netBalance">$0.00</p>
            </div>
            <div class="balance-grid">
                <div class="balance-box">
                    <h3>Income</h3>
                    <p id="totalIncome" style="color: #10b981;">$0.00</p>
                </div>
                <div class="balance-box">
                    <h3>Expenses</h3>
                    <p id="totalExpense" style="color: #ef4444;">$0.00</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Category Summaries</h2>
            <div class="weekly-row">
                <span>🥗 Normal Eating:</span>
                <strong id="eatingTotal">$0.00</strong>
            </div>
            <div class="weekly-row" style="border-bottom:none;">
                <span>🌐 Internet & Online:</span>
                <strong id="internetTotal">$0.00</strong>
            </div>
        </div>

        <div class="card">
            <h2>Add Entry</h2>
            <form id="transactionForm">
                <div class="form-group">
                    <label>Type</label>
                    <select id="type">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category">
                        <option value="Normal Eating">Normal Eating (Groceries/Dining)</option>
                        <option value="Internet & Online">Internet & Online Shopping</option>
                        <option value="Housing/Bills">Housing & Bills</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="title" placeholder="e.g., Groceries" required>
                </div>
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>
                <button type="submit" id="submitBtn">Add Transaction</button>
            </form>
        </div>

        <div class="card">
            <h2>History</h2>
            <ul id="transactionList">
                <div class="empty-state">Loading data...</div>
            </ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
